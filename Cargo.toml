[package]
name = "notepad0"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Claude Henchoz <claude.henchoz@gmail.com>"]

[dependencies]

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_DataExchange",
]

[build-dependencies]
embed-manifest = "1.5"
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
