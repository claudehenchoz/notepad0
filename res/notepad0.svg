<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Copyright (C) 2026 Claude Henchoz. SPDX-License-Identifier: GPL-3.0-or-later -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3edf8"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9be0"/>
      <stop offset="1" stop-color="#2459a6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7783"/>
      <stop offset="0.45" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#5a636e"/>
    </linearGradient>
    <linearGradient id="zero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa33a"/>
      <stop offset="1" stop-color="#e2600c"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <rect x="38" y="42" width="188" height="204" rx="12" fill="#000" opacity="0.18"/>
  <!-- page -->
  <rect x="32" y="34" width="188" height="204" rx="12" fill="url(#paper)" stroke="#6f86a6" stroke-width="4"/>
  <!-- header band -->
  <path d="M34 46 a10 10 0 0 1 10 -10 h164 a10 10 0 0 1 10 10 v30 h-184 z" fill="url(#band)"/>
  <!-- ruled lines -->
  <g stroke="#9dbbe3" stroke-width="4">
    <line x1="46" y1="104" x2="206" y2="104"/>
    <line x1="46" y1="130" x2="206" y2="130"/>
    <line x1="46" y1="156" x2="206" y2="156"/>
    <line x1="46" y1="182" x2="206" y2="182"/>
    <line x1="46" y1="208" x2="206" y2="208"/>
  </g>
  <line x1="66" y1="80" x2="66" y2="234" stroke="#e48b8b" stroke-width="3"/>
  <!-- spiral rings -->
  <g fill="url(#ring)" stroke="#3d4650" stroke-width="3">
    <rect x="56"  y="16" width="16" height="44" rx="8"/>
    <rect x="92"  y="16" width="16" height="44" rx="8"/>
    <rect x="128" y="16" width="16" height="44" rx="8"/>
    <rect x="164" y="16" width="16" height="44" rx="8"/>
  </g>
  <g fill="#1b3f78">
    <circle cx="64"  cy="56" r="5"/>
    <circle cx="100" cy="56" r="5"/>
    <circle cx="136" cy="56" r="5"/>
    <circle cx="172" cy="56" r="5"/>
  </g>
  <!-- slashed zero -->
  <g transform="translate(156 160)">
    <ellipse rx="44" ry="68" fill="none" stroke="#ffffff" stroke-width="40"/>
    <line x1="-20" y1="34" x2="20" y2="-34" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
    <ellipse rx="44" ry="68" fill="none" stroke="#a8410a" stroke-width="30"/>
    <ellipse rx="44" ry="68" fill="none" stroke="url(#zero)" stroke-width="24"/>
    <line x1="-20" y1="34" x2="20" y2="-34" stroke="#a8410a" stroke-width="22" stroke-linecap="round"/>
    <line x1="-20" y1="34" x2="20" y2="-34" stroke="url(#zero)" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
